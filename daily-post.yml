name: CarDoggo Daily Post

on:
  schedule:
    # Runs at 13:00 UTC every day. Adjust the hour to taste --
    # e.g. for ~8am US Eastern, use '0 12 * * *' (or 13 during standard time).
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

permissions:
  contents: write   # needed so the workflow can save state.json back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the agent
        env:
          WP_BASE_URL: https://cardoggo.com
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PUBLISH_STATUS: ${{ vars.PUBLISH_STATUS || 'draft' }}
        run: python agent.py

      - name: Save topic memory back to the repo
        run: |
          git config user.name "cardoggo-agent"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --quiet --cached; then
            echo "No state.json changes to save."
            exit 0
          fi
          git commit -m "Update used topics [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done
